# Release to PyPI from an exact version tag via Trusted Publishing (OIDC).
#
# Triggers:
#   - pushing a tag like v0.2.23 (tag release flow): the exact tag source is
#     built on a clean runner, gated, and published.
#   - manual workflow_dispatch with an EXISTING tag (first-PyPI-publish flow,
#     e.g. tag=v0.2.23): the tag's already-published immutable wheel+sdist are
#     downloaded and validated — never rebuilt, never relabeled.
#
# Critical separation: the publish helper (scripts/publish.py) postdates older
# release tags, so it is checked out once from the explicit trusted workflow
# revision (the commit running this workflow) into helper/ and used for both
# flows. The selected tag's source is checked out separately (push flow only)
# and is never assumed to contain the helper.
#
# One-time prerequisite (owner, NOT this workflow):
#   Add a pending Trusted Publisher for x0c/sesskit on PyPI scoped to this
#   workflow file and (optionally) the `pypi` environment. The first publish
#   through it creates the `sesskit` project; later publishes use it as a
#   normal publisher:
#   https://docs.pypi.org/trusted-publishers/using-a-publisher/
#
# Local (non-CI) publish path, documented in README "Release verification
# (maintainers)": validate with scripts/publish.py check-dist, then run
# scripts/publish.py upload with credentials from the environment only.
#
# Action pins below are reviewed commit SHAs (2026-11-01) with the floating
# tag kept in the trailing comment. Repin deliberately, never float.
#
# Release commands (owner):
#   ./scripts/publish.py verify --version 0.2.23 --check-only
#   git tag v0.2.23 && git push origin v0.2.23   # tag flow, or
#   gh workflow run publish-pypi.yml -f tag=v0.2.23   # dispatch flow

name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing release tag to publish (e.g. v0.2.23)"
        required: true
        default: "v0.2.23"

permissions: {}

jobs:
  build:
    name: build new tag from exact source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Read-only checkouts only. No id-token here: this job can never publish.
      contents: read
    steps:
      - name: Resolve exact tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REQUESTED_TAG:-$REF_NAME}"
          case "${TAG}" in
            v*) ;;
            *) echo "refusing non-version tag: ${TAG}" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          case "${VERSION}" in
            [0-9]*.[0-9]*.[0-9]*)
              case "${VERSION}" in
                *[!0-9.]* | *.*.*.*) echo "refusing unparseable version: ${VERSION}" >&2; exit 1 ;;
              esac
              ;;
            *) echo "refusing unparseable version: ${VERSION}" >&2; exit 1 ;;
          esac
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "building exact tag ${TAG}"

      - name: Check out helper from explicit trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # The commit running this workflow — never a moving ref. The helper
          # postdates older release tags and must not come from the tag tree.
          ref: ${{ github.sha }}
          path: helper
          # Single file, not a directory: cone mode rejects this with 128,
          # so the official single-file form requires cone mode off.
          sparse-checkout: scripts/publish.py
          sparse-checkout-cone-mode: false

      - name: Check out the exact tag source (clean)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ env.TAG }}
          path: source
          fetch-depth: 0
          clean: true

      - name: Refuse tag/version mismatch or dirty tree
        run: |
          VERSION="${TAG#v}"
          PYPROJECT_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' source/pyproject.toml | head -n 1)"
          test "${PYPROJECT_VERSION}" = "${VERSION}" || {
            echo "tag ${TAG} != pyproject version ${PYPROJECT_VERSION}" >&2
            exit 1
          }
          test -z "$(git -C source status --porcelain)" || {
            echo "tag checkout is not clean" >&2
            exit 1
          }
          echo "tag ${TAG} matches source (pyproject ${PYPROJECT_VERSION})"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheels from tag source
        run: |
          python -m pip install 'maturin==1.16.0' 'setuptools>=77' wheel 'ziglang==0.15.2'
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          cd source
          python scripts/build_release.py --out ../dist --zig --pure --sdist

      - name: Gate on local artifact check (trusted helper)
        run: |
          python helper/scripts/publish.py check-dist --version "${TAG#v}" --dist dist

      - name: Hand off exact artifacts to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sesskit-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  validate-release:
    name: validate existing release assets (no rebuild)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Read-only helper checkout only. No id-token here: never publishes.
      contents: read
    steps:
      - name: Resolve exact tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REQUESTED_TAG:-$REF_NAME}"
          case "${TAG}" in
            v*) ;;
            *) echo "refusing non-version tag: ${TAG}" >&2; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          case "${VERSION}" in
            [0-9]*.[0-9]*.[0-9]*)
              case "${VERSION}" in
                *[!0-9.]* | *.*.*.*) echo "refusing unparseable version: ${VERSION}" >&2; exit 1 ;;
              esac
              ;;
            *) echo "refusing unparseable version: ${VERSION}" >&2; exit 1 ;;
          esac
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "validating existing release ${TAG} (no rebuild)"

      - name: Check out helper from explicit trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # The commit running this workflow — never a moving ref, and never
          # the selected tag tree (old tags predate the helper).
          ref: ${{ github.sha }}
          path: helper
          # Single file, not a directory: cone mode rejects this with 128,
          # so the official single-file form requires cone mode off.
          sparse-checkout: scripts/publish.py
          sparse-checkout-cone-mode: false

      - name: Validate published assets with trusted helper
        run: |
          python helper/scripts/publish.py verify --version "${TAG#v}" --check-only --work-dir release-dist

      - name: Hand off validated assets to publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sesskit-dist
          path: |
            release-dist/*.whl
            release-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to PyPI via Trusted Publishing (no stored API token)
    needs: [build, validate-release]
    # Exactly one producer runs per trigger. Publish only when the producer
    # that ran succeeded and the other stayed skipped: a success paired with
    # any failure/cancellation must never publish.
    if: ${{ !cancelled() && ((needs.build.result == 'success' && needs.validate-release.result == 'skipped') || (needs.validate-release.result == 'success' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for Trusted Publishing; scoped to this job only.
      id-token: write
      # Read the handed-off build artifact. No contents:write anywhere.
      actions: read
    steps:
      - name: Fetch exact handed-off artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sesskit-dist
          path: dist

      - name: Publish to PyPI via Trusted Publishing (no stored API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
