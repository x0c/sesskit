name: Integration feedback
description: Tell us what you are building with SessKit and what blocked you.
title: "[Integration] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying SessKit. This is a public issue: do not attach credentials,
        private code, full transcripts, or unreviewed logs. Synthetic or redacted
        examples are welcome. We do not need your complete session history.
  - type: textarea
    id: use-case
    attributes:
      label: What are you building?
      description: Describe your tool and what you want to read or export.
      placeholder: A local search index, an analysis script, or a session viewer.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: SessKit version, runtime names/versions, and operating system.
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Desired result and current obstacle
      description: What did you try, what happened, and what information is missing?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Optional minimal example
      description: Use synthetic data or a carefully reviewed, redacted sample.
