[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sesskit"
version = "0.3.4"
description = "Parse and export local Claude Code, Codex CLI, and Cursor agent session files from disk. Python transcript parser library and JSON CLI — not a TUI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SessKit contributors" }]
keywords = [
  "claude-code",
  "codex-cli",
  "cursor",
  "session-parser",
  "transcript",
  "jsonl",
  "parser",
  "export",
  "sdk",
  "opencode",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/x0c/sesskit"
Issues = "https://github.com/x0c/sesskit/issues"

[project.scripts]
sesskit = "sesskit.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "sesskit._native"
strip = false
exclude = ["TASKBOARD.md", "build/**"]
include = [
  { path = "AGENTS.md", format = "sdist" },
  { path = "README.zh-CN.md", format = "sdist" },
  { path = "MANIFEST.in", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  { path = "docs/**/*.md", format = "sdist" },
  { path = "examples/*.py", format = "sdist" },
  { path = "scripts/*.py", format = "sdist" },
  { path = "tests/*.py", format = "sdist" },
  { path = "schemas/*.json", format = "sdist" },
  { path = ".github/**/*.yml", format = "sdist" },
]

# Used only to build the explicit pure-Python compatibility wheel.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sesskit = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
